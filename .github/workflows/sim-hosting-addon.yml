name: SIM HOSTING ADDON CI
on:
  push:
    branches: [main]
    paths:
      - 'addons/sim-hosting/**'
      - 'tests/**'
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/migrations/**'
      - 'routes/**'
      - 'resources/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/migrations/**'
      - 'routes/**'
      - 'resources/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    branches: [main]
    paths:
      - 'addons/sim-hosting/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
  workflow_dispatch:

jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p bootstrap/cache storage/app storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: find addons/sim-hosting -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test tests/Feature/SimHostingProviderAdapterTest.php
      - run: php artisan test --filter='sim-hosting'
