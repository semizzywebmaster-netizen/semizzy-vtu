name: SEMIZZY ONE CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p bootstrap/cache storage/app storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: npm install
      - run: npm run build
      - name: Upload production frontend build
        uses: actions/upload-artifact@v4
        with:
          name: semizzy-one-public-build
          path: public/build
          if-no-files-found: error
          retention-days: 7
      - run: find app addons bootstrap config database public routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -l public/index.php
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

# CI trigger checkpoint for full Core, CAC, analytics, communication, realtime, auth, security and VTU validation.

  financial-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: semizzy_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: semizzy_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pcntl
          coverage: none
      - run: mkdir -p bootstrap/cache storage/app storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Prepare dedicated MySQL test schema
        run: php artisan migrate:fresh --force
      - name: Run real MySQL wallet concurrency races
        run: php artisan test tests/Integration/Finance/WalletConcurrencyMySqlTest.php
      - name: Run real MySQL P2P transfer concurrency races
        run: php artisan test tests/Integration/P2p/P2pTransferConcurrencyMySqlTest.php
      - name: Verify reversal and refund settlement on MySQL
        run: |
          php artisan test tests/Feature/Finance/WalletReversalServiceTest.php
          php artisan test tests/Feature/Payments/PaymentRefundSettlementServiceTest.php
