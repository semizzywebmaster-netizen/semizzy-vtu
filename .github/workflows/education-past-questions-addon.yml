name: SEMIZZY ONE Education Past Questions Addon CI
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/migrations/**'
      - 'routes/**'
      - 'resources/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'addons/education/**'
      - 'resources/js/Pages/Education/**'
      - 'resources/js/Pages/Admin/Education/**'
      - 'tests/Feature/EducationPastQuestionsAddonTest.php'
      - '.github/workflows/education-past-questions-addon.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/migrations/**'
      - 'routes/**'
      - 'resources/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'addons/education/**'
      - 'resources/js/Pages/Education/**'
      - 'resources/js/Pages/Admin/Education/**'
      - 'tests/Feature/EducationPastQuestionsAddonTest.php'
      - '.github/workflows/education-past-questions-addon.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
jobs:
  education-past-questions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p bootstrap/cache storage/app storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: npm install
      - run: npm run build
      - run: find addons/education tests/Feature/EducationPastQuestionsAddonTest.php -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test tests/Feature/EducationPastQuestionsAddonTest.php
