name: Publish public build assets (temporary)
on:
  push:
    branches:
      - fix/settings-theme-responsive-grid
permissions:
  contents: write
jobs:
  publish-build:
    if: "!startsWith(github.event.head_commit.message, 'chore: publish generated public/build')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/settings-theme-responsive-grid
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Commit compiled public/build files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/build
          if git diff --cached --quiet; then
            echo "public/build is already current"
            exit 0
          fi
          git commit -m "chore: publish generated public/build assets"
          git push origin HEAD:fix/settings-theme-responsive-grid
